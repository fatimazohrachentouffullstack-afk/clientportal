<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portail de gestion des clients</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>Portail Clients</h1>
        <nav>
            <a href="#accueil">Accueil</a>
            <a href="#clients">Clients</a>
        </nav>
    </header>

    <main>
        <section id="accueil" class="welcome">
            <h2>Bienvenue dans notre portail</h2>
            <p>Application simple pour gérer les clients de DevWeb.</p>
        </section>

        <section id="clients">
            <div class="section-title">
                <h2>Liste des clients</h2>
                <button id="openModal">Ajouter un client</button>
            </div>
            <p id="message"></p>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Email</th>
                        <th>Téléphone</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="clientTable"></tbody>
            </table>
        </section>
    </main>

    <div id="clientModal" class="modal">
        <div class="modal-content">
            <button id="closeModal" class="close">X</button>
            <h2 id="formTitle">Ajouter un client</h2>
            <form id="clientForm">
                <input type="hidden" id="clientId">
                <label>Nom</label>
                <input type="text" id="nom" placeholder="Nom du client">
                <label>Email</label>
                <input type="text" id="email" placeholder="exemple@mail.com">
                <label>Téléphone</label>
                <input type="text" id="telephone" placeholder="0600000000">
                <button type="submit">Enregistrer</button>
            </form>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>

</html>
